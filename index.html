<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밴드 연습 일정표</title>
  
  <style>
    :root {
      --bg: #F3F5F9; --surface: #FFFFFF; --line: #DADFE8; --fg: #1B2232; --muted: #59647A;
      --ink: #22304D; --ink-fg: #FFFFFF; --hover: #EEF2FA; --hit: #E4F2E8; --hit-line: #2F7D4F; --dinner: #FBF1DF;
      --c-yerin: #C23B3B; --c-seungyeon: #B3600A; --c-juyeon: #2F7D4F; --c-eunyi: #1F7A8C; --c-bongsun: #3F5FC4; --c-student: #8A47B5;
      --chip-fg: #FFFFFF; --alert: #C62828;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.5;
      padding: 24px 16px 40px; margin: 0;
    }
    .wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    header { display: flex; flex-direction: column; gap: 4px; }
    h1 { font-size: 1.5rem; margin: 0; }
    .sub { margin: 0; color: var(--muted); font-size: 0.9rem; }
    h2 { font-size: 0.85rem; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; padding: 4px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); width: fit-content; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #9E9E9E; }
    .status-dot.online { background: #4CAF50; }
    .status-dot.syncing { background: #FF9800; }
    .em { color: var(--alert); margin-left: 8px; font-weight: 700; }
    .who-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .who { display: flex; flex-wrap: wrap; gap: 8px; }
    .who button { font: inherit; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 40px; }
    .who button i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); display: inline-block; }
    .who button small { color: var(--muted); font-size: 0.78rem; }
    .who button[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 2px var(--c); font-weight: 700; }
    .btn-reset { font-size: 0.8rem; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .tabs { display: flex; max-width: 100%; overflow-x: auto; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
    .tabs button { white-space: nowrap; font: inherit; font-size: 0.88rem; padding: 8px 14px; border: 0; background: transparent; color: var(--fg); cursor: pointer; min-height: 38px; }
    .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); font-weight: 700; }
    .hint { font-size: 0.86rem; color: var(--muted); margin: 0; }
    #msg { min-height: 1.4em; font-size: 0.86rem; color: var(--alert); margin: 0; font-weight: 500; }
    .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; table-layout: fixed; }
    th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; vertical-align: top; }
    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
    thead th { font-size: 0.88rem; font-weight: 700; padding: 10px 6px; text-align: center; background: var(--surface); }
    .time { width: 88px; position: sticky; left: 0; z-index: 1; background: var(--surface); font-size: 0.86rem; font-weight: 500; text-align: center; padding: 10px 6px; }
    .cell { font: inherit; display: flex; flex-direction: column; gap: 6px; width: 100%; min-height: 66px; padding: 8px; border: 0; background: transparent; text-align: left; cursor: pointer; position: relative; color: var(--fg); }
    .cell:hover { background: var(--hover); }
    .cell.mine { box-shadow: inset 0 0 0 2.5px var(--mc); }
    .cell.all { background: var(--hit); }
    .cnt { font-size: 0.7rem; color: var(--muted); align-self: flex-end; margin-top: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { background: var(--c); color: var(--chip-fg); font-size: 0.76rem; font-weight: 500; padding: 4px 6px; border-radius: 4px; }
    .dinner th, .dinner td { background: var(--dinner); }
    .top { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .top-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .top ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .top li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 0.92rem; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .btn-copy { font-size: 0.82rem; padding: 6px 12px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--ink-fg); font-weight: 700; cursor: pointer; }
  </style>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="wrap">
  <header>
    <h1>밴드 연습 일정표</h1>
    <p class="sub">가능한 날짜와 시간에 내 이름을 체크하세요. 실시간으로 모두에게 공유됩니다.</p>
    <div style="margin-top: 6px;">
      <span class="status-badge">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">불러오는 중...</span>
      </span>
    </div>
  </header>

  <section>
    <div class="who-header">
      <h2 style="margin:0;">1. 내 이름 고르기</h2>
      <button type="button" class="btn-reset" onclick="resetMySchedule()">내 이번 주 일정 비우기</button>
    </div>
    <div class="who" id="who"></div>
  </section>

  <section>
    <h2>2. 가능한 칸 누르기 <span class="em">(가능한 시간 모두 체크해주세요)</span></h2>
    <div class="bar">
      <div class="tabs" id="tabs"></div>
      <p class="hint">칸을 누르면 체크, 다시 누르면 취소됩니다.</p>
    </div>
    <p id="msg" role="status"></p>
    <div class="scroll"><table id="grid"></table></div>
  </section>

  <section class="top">
    <div class="top-head">
      <h2 style="margin:0;">🏆 많이 모이는 시간 TOP 3</h2>
      <button type="button" class="btn-copy" onclick="copyTopText()">요약 결과 복사</button>
    </div>
    <div id="top"></div>
  </section>
</div>

<script>
(function() {
  const MEMBERS = [
    { k: 'yerin', n: '이예린', i: '드럼' },
    { k: 'seungyeon', n: '김승연', i: '피아노' },
    { k: 'juyeon', n: '오주연', i: '보컬' },
    { k: 'eunyi', n: '황은이', i: '보컬' },
    { k: 'bongsun', n: '김봉순', i: '베이스' },
    { k: 'student', n: '학생', i: '기타' }
  ];

  const DAY = ['월', '화', '수', '목', '금'];
  const HOURS = [15, 16, 17, 18, 19, 20];
  const pad = n => String(n).padStart(2, '0');

  const MONDAYS = [[2026, 11, 9], [2026, 11, 16], [2026, 11, 23], [2026, 11, 30]];
  const DATES = MONDAYS.map(([y, mo, dd]) => DAY.map((d, i) => {
    const dt = new Date(y, mo - 1, dd + i);
    const m = dt.getMonth() + 1, day = dt.getDate();
    return { id: '' + dt.getFullYear() + pad(m) + pad(day), label: m + '월 ' + day + '일(' + d + ')', short: m + '/' + day };
  }));
  const WEEKS = DATES.map(w => {
    const a = w[0].short.split('/'), b = w[4].short.split('/');
    return { label: w[0].short + '~' + (a[0] === b[0] ? b[1] : w[4].short) };
  });

  const color = k => 'var(--c-' + k + ')';
  const byKey = Object.fromEntries(MEMBERS.map(m => [m.k, m]));

  let avail = new Set(), dinner = new Set(), pending = new Set();
  let week = 0, me = null;

  try { me = localStorage.getItem('band-me'); } catch (e) {}
  if (!byKey[me]) me = null;

  const $ = s => document.querySelector(s);
  const say = t => { const el = $('#msg'); if (el) el.textContent = t || ''; };

  function setStatus(online, text) {
    const dot = $('#status-dot');
    const txt = $('#status-text');
    if (!dot || !txt) return;
    if (online) {
      dot.className = 'status-dot online';
      txt.textContent = text || '실시간 연결 완료';
    } else {
      dot.className = 'status-dot syncing';
      txt.textContent = text || '연결 준비 중...';
    }
  }

  const firebaseConfig = {
    apiKey: "AIzaSyCiQOwTSvtOR6OwDclmT64zvYzYFcCU14c",
    authDomain: "band-app-8d288.firebaseapp.com",
    projectId: "band-app-8d288",
    storageBucket: "band-app-8d288.firebasestorage.app",
    messagingSenderId: "322486693616",
    appId: "1:322486693616:web:adc3c5d383fb5899c99c35"
  };

  let db = null;

  function chipsFor(test) {
    return MEMBERS.filter(m => test(m.k)).map(m => '<span class="chip" style="--c:' + color(m.k) + '">' + m.n + '</span>').join('');
  }

  function renderWho() {
    const el = $('#who');
    if (!el) return;
    el.innerHTML = MEMBERS.map(m =>
      '<button type="button" data-k="' + m.k + '" style="--c:' + color(m.k) + '" aria-pressed="' + (m.k === me) + '"><i></i>' + m.n + ' <small>' + m.i + '</small></button>'
    ).join('');
  }

  function renderTabs() {
    const el = $('#tabs');
    if (!el) return;
    el.innerHTML = WEEKS.map((w, i) =>
      '<button type="button" data-w="' + i + '" aria-pressed="' + (i === week) + '">' + w.label + '</button>'
    ).join('');
  }

  function cellHtml(col, id, present, n, mineOn, showAll) {
    const all = n === MEMBERS.length;
    const cls = 'cell' + (mineOn ? ' mine' : '') + (all && showAll ? ' all' : '');
    const style = mineOn ? ' style="--mc:' + color(me) + '"' : '';
    return '<button type="button" class="' + cls + '" data-col="' + col + '" data-id="' + id + '"' + style + ' aria-pressed="' + mineOn + '">'
      + '<span class="chips">' + present + '</span>' + (n ? '<span class="cnt">' + n + '/' + MEMBERS.length + '</span>' : '') + '</button>';
  }

  function renderGrid() {
    const el = $('#grid');
    if (!el) return;
    const days = DATES[week];
    let h = '<colgroup><col style="width:88px">' + days.map(() => '<col>').join('') + '</colgroup>';
    h += '<thead><tr><th class="time" scope="col">참여 시간</th>' + days.map(d => '<th scope="col">' + d.label + '</th>').join('') + '</tr></thead><tbody>';
    
    HOURS.forEach(hr => {
      h += '<tr><th class="time" scope="row">' + pad(hr) + ':00</th>';
      days.forEach(d => {
        const ids = MEMBERS.filter(m => avail.has(d.id + '_' + hr + '_' + m.k));
        const present = chipsFor(k => avail.has(d.id + '_' + hr + '_' + k));
        const mineOn = me && avail.has(d.id + '_' + hr + '_' + me);
        h += '<td>' + cellHtml('avail', d.id + '_' + hr + '_' + (me || 'x'), present, ids.length, mineOn, true) + '</td>';
      });
      h += '</tr>';
    });

    h += '<tr class="dinner"><th class="time" scope="row">저녁 식사<br>같이 먹기</th>';
    days.forEach(d => {
      const n = MEMBERS.filter(m => dinner.has(d.id + '_' + m.k)).length;
      const present = chipsFor(k => dinner.has(d.id + '_' + k));
      const mineOn = me && dinner.has(d.id + '_' + me);
      h += '<td>' + cellHtml('dinner', d.id + '_' + (me || 'x'), present, n, mineOn, true) + '</td>';
    });
    h += '</tr></tbody>';
    el.innerHTML = h;
  }

  function getTop3List() {
    const rows = [];
    DATES.forEach(w => w.forEach(d => HOURS.forEach(hr => {
      const here = MEMBERS.filter(m => avail.has(d.id + '_' + hr + '_' + m.k));
      if (here.length >= 2) rows.push({ d, hr, n: here.length, miss: MEMBERS.filter(m => !here.includes(m)) });
    })));
    rows.sort((a, b) => b.n - a.n || (a.d.id + pad(a.hr)).localeCompare(b.d.id + pad(b.hr)));
    return rows.slice(0, 3);
  }

  function renderTop() {
    const el = $('#top');
    if (!el) return;
    const top = getTop3List();
    el.innerHTML = top.length
      ? '<ol>' + top.map(r => '<li><b>' + r.d.label + ' ' + pad(r.hr) + ':00</b><span>' + r.n + '/' + MEMBERS.length + '명 가능</span>'
        + (r.miss.length ? '<span style="color:var(--muted);font-size:0.84rem;">(어려운 사람: ' + r.miss.map(m => m.n).join(', ') + ')</span>' : '<span style="color:var(--muted);font-size:0.84rem;">전원 가능!</span>') + '</li>').join('') + '</ol>'
      : '<p style="color:var(--muted);margin:0;">아직 체크한 칸이 없습니다. 가능한 시간에 체크해 보세요.</p>';
  }

  function render() {
    renderWho();
    renderTabs();
    renderGrid();
    renderTop();
  }

  async function toggle(col, id, data) {
    if (!db) { say('클라우드 미연결 상태입니다.'); return; }
    const set = col === 'avail' ? avail : dinner;
    if (pending.has(col + id)) return;
    pending.add(col + id);
    setStatus(false, '저장 중...');

    try {
      const ref = db.collection(col).doc(id);
      if (set.has(id)) {
        await ref.delete();
      } else {
        await ref.set(data);
      }
      say('');
    } catch (e) {
      console.error(e);
      say('저장 실패. 인터넷 또는 Firebase 설정을 확인해주세요.');
    } finally {
      pending.delete(col + id);
      setStatus(true);
    }
  }

  document.addEventListener('click', ev => {
    const w = ev.target.closest('#who button');
    if (w) {
      me = w.dataset.k;
      try { localStorage.setItem('band-me', me); } catch (e) {}
      say(''); render(); return;
    }
    const t = ev.target.closest('#tabs button');
    if (t) { week = +t.dataset.w; render(); return; }
    
    const c = ev.target.closest('.cell');
    if (!c) return;
    if (!me) { say('먼저 위에서 내 이름을 고르고 체크해 주세요!'); return; }
    
    const id = c.dataset.id.replace(/_x$/, '_' + me), col = c.dataset.col, p = id.split('_');
    toggle(col, id, col === 'avail' ? { d: p[0], h: +p[1], m: me } : { d: p[0], m: me });
  });

  window.resetMySchedule = async function() {
    if (!me) { say('먼저 내 이름을 선택해 주세요.'); return; }
    if (!confirm(`'${byKey[me].n}' 선생님의 모든 연습 일정을 삭제하시겠습니까?`)) return;

    setStatus(false, '초기화 중...');
    try {
      const batch = db.batch();
      avail.forEach(id => {
        if (id.endsWith('_' + me)) batch.delete(db.collection('avail').doc(id));
      });
      dinner.forEach(id => {
        if (id.endsWith('_' + me)) batch.delete(db.collection('dinner').doc(id));
      });
      await batch.commit();
      say('내 일정이 초기화되었습니다.');
    } catch (e) {
      say('초기화에 실패했습니다.');
    } finally {
      setStatus(true);
    }
  };

  window.copyTopText = function() {
    const top = getTop3List();
    if (!top.length) { alert('체크된 인원이 없습니다.'); return; }
    let txt = '[밴드 연습 모이기 좋은 시간 TOP 3]\n';
    top.forEach((r, i) => {
      txt += `${i + 1}. ${r.d.label} ${pad(r.hr)}:00 (${r.n}명 가능)\n`;
      if (r.miss.length) txt += `   - 불참: ${r.miss.map(m => m.n).join(', ')}\n`;
      else txt += `   - 전원 가능! 🎉\n`;
    });
    navigator.clipboard.writeText(txt).then(() => {
      alert('단톡방 공유용 텍스트가 복사되었습니다!');
    });
  };

  // 무조건 즉시 화면 그리기
  render();

  // Firebase 실시간 동기화
  if (typeof firebase !== 'undefined') {
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();

      db.collection('avail').onSnapshot(s => {
        avail = new Set(s.docs.map(d => d.id));
        setStatus(true);
        render();
      }, err => setStatus(false, '실시간 연결 중...'));

      db.collection('dinner').onSnapshot(s => {
        dinner = new Set(s.docs.map(d => d.id));
        setStatus(true);
        render();
      }, err => setStatus(false, '실시간 연결 중...'));

    } catch (e) {
      console.error(e);
      setStatus(false, '로컬 실행 중');
    }
  } else {
    setStatus(false, 'Firebase 연결 불가');
  }
})();
</script>
</body>
</html>
